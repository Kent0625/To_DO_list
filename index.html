<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Speedster Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="board-container" id="board">
        </div>

    <div id="addModal" class="modal">
        <div class="modal-content">
            <h3>Add Card</h3>
            <input type="text" id="newCardText" placeholder="Enter task title...">
            <div class="modal-actions">
                <button class="cancel" onclick="closeModal()">Cancel</button>
                <button class="primary" onclick="confirmAddCard()">Add Card</button>
            </div>
        </div>
    </div>

    <script src="https://bernardo-castilho.github.io/DragDropTouch/DragDropTouch.js"></script>

    <script src="script.js"></script>
</body>
</html>
